port: 7890
socks-port: 7891
mixed-port: 7893
ipv6: true
allow-lan: false
bind-address: "127.0.0.1"
unified-delay: true
tcp-concurrent: true

# GeoData Settings
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# Control Panel
external-controller: "127.0.0.1:9090"
# secret 留空，部署后请在本机/客户端面板自行设置一个独立密钥；公共配置中不应硬编码
secret: ""
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/gh-pages.zip"

# Core Behavior
find-process-mode: always
keep-alive-idle: 600
keep-alive-interval: 30

# Profile Settings
profile:
  store-selected: true
  store-fake-ip: true

# Traffic Sniffing
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
  force-domain:
    - '+.v2ex.com'
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.push.apple.com'
    - '+.apple.com'

# TUN Mode Configuration
tun:
  enable: true
  stack: mixed
  mtu: 1500
  # IPv6 Fake-IP 使用独立 TUN 地址，配合 strict-route 防止绕过。
  inet6-address:
    - fdfe:dcba:9877::1/126
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true
  auto-detect-interface: true
  # Windows 下阻止多网卡、系统 DNS 和 IPv6 绕过 TUN；代价是局域网入站访问可能受限。
  strict-route: true

# DNS Configuration
dns:
  enable: true
  listen: '127.0.0.1:1053'
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  # 使用 RFC 2544 基准测试保留网段，避免与真实公网地址冲突。
  fake-ip-range: 198.18.0.0/15
  # IPv6 Fake-IP 使用 ULA 网段，避免 AAAA 查询在开启 IPv6 后返回空结果。
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - geosite:private
    - geosite:cn
  default-nameserver:
    # 仅用于解析 DoH 主机名；使用 IP 形式的 DoH，避免明文 UDP 引导查询。
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  # 只负责解析代理节点域名，必须能够在代理尚未建立时直连访问。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 境外域名的加密 DNS 按规则通过当前代理，减少本地 DNS 暴露。
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  # DIRECT 流量使用国内 DoH，兼顾国内 CDN 命中与解析可用性。
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'rule-set:private_domain,cn_domain':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    'geosite:geolocation-!cn':
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

# ----------------- 锚点与模板 (Templates & Anchors) -----------------
templates:
  - &RegionalCheck
    url: 'https://www.gstatic.com/generate_204'
    expected-status: 204
    interval: 600
    lazy: true
    max-failed-times: 3
  - &RegionalNodes
    <<: *RegionalCheck
    type: url-test
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    tolerance: 100
    hidden: true
    exclude-filter: &IneligibleNodes '(?i)专线|到期|过期|剩余|流量|官网|公告|客服|套餐|重置|高风险|高欺诈|high[ -]risk|\b(?:traffic|expire[ds]?|reset|official[ -]site)\b|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?<![\d.])(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍)'
  - &AICheck
    <<: *RegionalCheck
    url: 'https://chatgpt.com/robots.txt'
    expected-status: 200

# ----------------- 策略组 (Proxy Groups) -----------------
proxy-groups:
  - name: 🤖 AI
    type: select
    proxies: [🇺🇲 AI 美国自动, 🇯🇵 AI 日本, 🇸🇬 AI 新加坡]
    # 可直接手选订阅节点，所有 AI 规则共用此选择。
    include-all: true
    exclude-type: direct
    exclude-filter: *IneligibleNodes
  - name: 🎬 影音与社交
    type: select
    proxies: [🌏 香港优先, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇲 美国]
  - name: 💼 办公与账号
    type: select
    proxies: [🇺🇲 美国, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡]
  - name: 🚀 节点选择
    type: select
    proxies: [🌏 香港优先, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇲 美国]

  # 严格按地区顺序回退，同一地区内按测速结果选择节点。
  - name: 🌏 香港优先
    <<: *RegionalCheck
    type: fallback
    proxies: [🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡]
  - name: 🇭🇰 香港
    <<: *RegionalNodes
    filter: '(?i)^(?=.*(?:香港|🇭🇰|(?:^|[^A-Za-z])(?:HK|HKG)(?:[^A-Za-z]|$)|Hong[ -]*Kong|Kowloon))(?!.*(?:美国|United States|日本|Japan|新加坡|Singapore|台湾|Taiwan|韩国|South Korea|🇺[🇸🇲]|🇯🇵|🇸🇬|🇹🇼|🇰🇷|\b(?:US|USA|JP|SG|TW|KR)\b)).*$'
  - name: 🇯🇵 日本
    <<: *RegionalNodes
    filter: &JapanNodes '(?i)^(?=.*(?:日本|东京|大阪|名古屋|埼玉|🇯🇵|(?:^|[^A-Za-z])(?:JP|NRT|KIX|FUK)(?:[^A-Za-z]|$)|Japan|Tokyo|Osaka|Nagoya|Kyoto|Okinawa))(?!.*(?:美国|United States|香港|Hong[ -]*Kong|新加坡|Singapore|台湾|Taiwan|韩国|South Korea|🇺[🇸🇲]|🇭🇰|🇸🇬|🇹🇼|🇰🇷|\b(?:US|USA|HK|HKG|SG|TW|KR)\b)).*$'
  - name: 🇸🇬 新加坡
    <<: *RegionalNodes
    filter: &SingaporeNodes '(?i)^(?=.*(?:新加坡|狮城|🇸🇬|(?:^|[^A-Za-z])(?:SG|SIN)(?:[^A-Za-z]|$)|Singapore|Changi|Marina Bay))(?!.*(?:美国|United States|香港|Hong[ -]*Kong|日本|Japan|台湾|Taiwan|韩国|South Korea|🇺[🇸🇲]|🇭🇰|🇯🇵|🇹🇼|🇰🇷|\b(?:US|USA|HK|HKG|JP|TW|KR)\b)).*$'
  - name: 🇺🇲 美国
    <<: *RegionalNodes
    filter: '(?i)^(?=.*(?:美国|🇺[🇸🇲]|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|United States|Los Angeles|New York|San Francisco|Seattle|Dallas|Chicago|Miami|Boston|洛杉矶|纽约|西雅图|圣何塞|硅谷|达拉斯|芝加哥|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉))(?!.*(?:香港|Hong[ -]*Kong|日本|Japan|新加坡|Singapore|台湾|Taiwan|韩国|South Korea|加拿大|澳大利亚|澳洲|英国|🇭🇰|🇯🇵|🇸🇬|🇹🇼|🇨🇦|🇦🇺|🇬🇧|🇰🇷|\b(?:HK|HKG|JP|SG|TW|KR)\b|专线|到期|过期|剩余|流量|官网|公告|客服|套餐|重置|高风险|高欺诈|high[ -]risk|\b(?:traffic|expire[ds]?|reset|official[ -]site)\b|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?<![\d.])(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  # 直接检查实体节点，避免子组的旧健康结果挡住已通过检查的线路。
  # 反引号依次匹配低风险标签、家宽标签和其余美国节点，同档选首个健康节点。
  - name: 🇺🇲 AI 美国自动
    <<: *AICheck
    type: fallback
    include-all-providers: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)^(?=.*(?:美国|🇺[🇸🇲]|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|United States|Los Angeles|New York|San Francisco|Seattle|Dallas|Chicago|Miami|Boston|洛杉矶|纽约|西雅图|圣何塞|硅谷|达拉斯|芝加哥|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉))(?=.*(?:低风险|低欺诈|(?<![非不])纯净|\blow[ -]risk\b|\bclean[ -]ip\b))`(?i)^(?=.*(?:美国|🇺[🇸🇲]|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|United States|Los Angeles|New York|San Francisco|Seattle|Dallas|Chicago|Miami|Boston|洛杉矶|纽约|西雅图|圣何塞|硅谷|达拉斯|芝加哥|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉))(?=.*(?:(?<![非不])家宽|(?<![非不])住宅|(?<!non[ -])\bresidential\b))`(?i)^(?=.*(?:美国|🇺[🇸🇲]|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|United States|Los Angeles|New York|San Francisco|Seattle|Dallas|Chicago|Miami|Boston|洛杉矶|纽约|西雅图|圣何塞|硅谷|达拉斯|芝加哥|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉))'
    exclude-filter: '(?i)(?:香港|Hong[ -]*Kong|日本|Japan|新加坡|Singapore|台湾|Taiwan|韩国|South Korea|加拿大|澳大利亚|澳洲|英国|🇭🇰|🇯🇵|🇸🇬|🇹🇼|🇨🇦|🇦🇺|🇬🇧|🇰🇷|\b(?:HK|HKG|JP|SG|TW|KR)\b|专线|到期|过期|剩余|流量|官网|公告|客服|套餐|重置|高风险|高欺诈|high[ -]risk|\b(?:traffic|expire[ds]?|reset|official[ -]site)\b|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?<![\d.])(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))'
  - name: 🇯🇵 AI 日本
    <<: [*AICheck, *RegionalNodes]
    filter: *JapanNodes
  - name: 🇸🇬 AI 新加坡
    <<: [*AICheck, *RegionalNodes]
    filter: *SingaporeNodes

