port: 7890
socks-port: 7891
mixed-port: 7893
ipv6: true
allow-lan: false
bind-address: "127.0.0.1"
unified-delay: true
tcp-concurrent: true

# GeoData Settings
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# Control Panel
external-controller: "127.0.0.1:9090"
# secret 留空，部署后请在本机/客户端面板自行设置一个独立密钥；公共配置中不应硬编码
secret: ""
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/gh-pages.zip"

# Core Behavior
find-process-mode: always
keep-alive-idle: 600
keep-alive-interval: 30

# Profile Settings
profile:
  store-selected: true
  store-fake-ip: true

# Traffic Sniffing
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
  force-domain:
    - '+.v2ex.com'
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.push.apple.com'
    - '+.apple.com'

# TUN Mode Configuration
tun:
  enable: true
  stack: mixed
  mtu: 1500
  # IPv6 Fake-IP 使用独立 TUN 地址，配合 strict-route 防止绕过。
  inet6-address:
    - fdfe:dcba:9877::1/126
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true
  auto-detect-interface: true
  # Windows 下阻止多网卡、系统 DNS 和 IPv6 绕过 TUN；代价是局域网入站访问可能受限。
  strict-route: true

# DNS Configuration
dns:
  enable: true
  listen: '127.0.0.1:1053'
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  # 使用 RFC 2544 基准测试保留网段，避免与真实公网地址冲突。
  fake-ip-range: 198.18.0.0/15
  # IPv6 Fake-IP 使用 ULA 网段，避免 AAAA 查询在开启 IPv6 后返回空结果。
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - geosite:private
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只负责解析代理节点域名，必须能够在代理尚未建立时直连访问。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 境外域名的加密 DNS 按规则通过当前代理，减少本地 DNS 暴露。
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  # DIRECT 流量使用国内 DoH，兼顾国内 CDN 命中与解析可用性。
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    'rule-set:private_domain,cn_domain':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    'geosite:geolocation-!cn':
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

# ----------------- SublinkPro 节点注入 -----------------
# 生成订阅时，SublinkPro 会把聚合后的节点写入此处。
proxies: ~

# ----------------- 策略组 (Proxy Groups) -----------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [手动选择, 🏚️ 家宽节点, ♻️ 自动选择, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🌍 其他节点]

  - name: 手动选择
    type: select
    include-all: true

  - name: 📹 YouTube
    type: select
    proxies: [♻️ 自动选择, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🏚️ 家宽节点, 🚀 节点选择]
  - name: 🍀 Google
    type: select
    proxies: [🏚️ 家宽节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, ♻️ 自动选择]
  - name: 🍒 microsoft
    type: select
    proxies: [🏚️ 家宽节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, ♻️ 自动选择, 🚀 节点选择]
  - name: 📦 微软大流量
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🏹 ChatGPT
    type: select
    proxies: [🏚️ 家宽节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, ♻️ 自动选择]
  - name: 💻 GitHub
    type: select
    proxies: [🏚️ 家宽节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, ♻️ 自动选择, 🚀 节点选择]
  - name: 🐬 外贸
    type: select
    proxies: [🏚️ 家宽节点, 🇺🇲 美国节点, ♻️ 自动选择, 🚀 节点选择]
  - name: 🎵 TikTok
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: 📲 Telegram
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: 🎥 NETFLIX
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: ✈️ Speedtest
    type: select
    proxies: [DIRECT, ♻️ 自动选择, 🚀 节点选择]
  - name: 💶 PayPal
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: ☁️ cloudflare
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: 🍎 Apple
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [♻️ 自动选择, 🚀 节点选择]
  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT]

  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?=.*(?i)(?:香港|港|🇭🇰|HK|Hong Kong|HKG|沪港|深港|Kowloon|Victoria))(?!.*(?i)(?:美|🇺🇸|US|台|🇹🇼|TW|日|🇯🇵|JP|新|🇸🇬|SG|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: 🇺🇲 美国节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?=.*(?i)(?:美|🇺🇸|US|USA|States|American|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|New York|Miami|Boston|United States|San Francisco))(?!.*(?i)(?:港|🇭🇰|HK|台|🇹🇼|TW|日|🇯🇵|JP|新|🇸🇬|SG|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?=.*(?i)(?:日本|🇯🇵|JP|NRT|KIX|FUK|Japan|川日|东京|大阪|泉日|埼玉|名古屋|Nagoya|Kyoto|Okinawa))(?!.*(?i)(?:美|🇺🇸|US|港|🇭🇰|HK|台|🇹🇼|TW|新|🇸🇬|SG|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: 🇹🇼 台湾节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?=.*(?i)(?:台湾|台|🇹🇼|TW|TPE|KHH|Taiwan|新北|彰化|台北|Taipei|高雄|Kaohsiung|Taichung|台中))(?!.*(?i)(?:美|🇺🇸|US|港|🇭🇰|HK|日|🇯🇵|JP|新|🇸🇬|SG|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: 🇸🇬 新加坡节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?=.*(?i)(?:新加坡|坡|狮城|🇸🇬|SG|SIN|Singapore|Changi|Marina Bay))(?!.*(?i)(?:美|🇺🇸|US|港|🇭🇰|HK|台|🇹🇼|TW|日|🇯🇵|JP|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: 🌍 其他节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    filter: '^(?!.*(?i)(?:美|🇺🇸|US|日本|🇯🇵|JP|台湾|🇹🇼|TW|新加坡|🇸🇬|SG|香港|🇭🇰|HK|韩|🇰🇷|KR|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'
  - name: 🏚️ 家宽节点
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3
    # 只保留同时带有家宽和美国标识的节点。
    filter: '^(?=.*(?i)(?:家宽))(?=.*(?i)(?:美国|🇺🇸|(?:^|[^A-Za-z])(?:US|USA)(?:[^A-Za-z]|$)|United States|American|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|New York|Miami|Boston|San Francisco))(?!.*(?i)(?:亚洲|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$'

  - name: ♻️ 自动选择
    type: url-test
    proxies: [🇭🇰 香港节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🌍 其他节点]
    url: 'https://www.gstatic.com/generate_204'
    interval: 900
    tolerance: 100
    lazy: true
    max-failed-times: 3

