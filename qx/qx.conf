# 故障切换按订阅顺序选择首个可用节点，排除家宽、提示条目和 6 倍及以上节点。
available=♻️ 故障切换, server-tag-regex=(?i)^(?!.*(?:家宽|专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:^|[^\d.])(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$

# 家宽只保留美国节点，优先首个可用出口，避免仅因延迟变化切换支付会话的 IP。
available=🏠 家宽节点, server-tag-regex=(?i)^(?=.*家宽)(?=.*(?:美国|美國|🇺🇸|🇺🇲|(?:^|[^A-Za-z])(?:US|USA)(?:[^A-Za-z]|$)|United States|American|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|New York|Miami|Boston|San Francisco))(?!.*(?:专线|到期|过期|剩余|流量|时间|官网|产品|倍率\s*(?:[6-9]|[1-9]\d)(?:\.\d+)?|(?:^|[^\d.])(?:[6-9]|[1-9]\d)(?:\.\d+)?\s*(?:x|×|倍))).*$

