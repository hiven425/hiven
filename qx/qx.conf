# Quantumult X 网络核心配置
#
# 公共配置包含 DNS、分流、防泄漏策略和默认关闭的可选去广告复写。节点订阅在 Quantumult X 的
# 资源页面单独添加，建议使用 SublinkPro 的 client=quanx 私有分享链接。
# 不要把 Token、机场地址或其他凭据提交到本文件。

[general]

# QX 探测 URL 使用 HTTP，HTTPS 会导致配置解析失败；DoH 和远程资源使用 HTTPS。
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 3000
network_check_url = http://www.apple.com/library/test/success.html

# 只绕过局域网 SSDP；公网地址不得排除出隧道。
excluded_routes = 239.255.255.250/32

# 拒绝目的 UDP/443（含直连），促使常见 QUIC 回退 TCP；其他端口的 QUIC 不受此项限制。
# 节点不支持 UDP 时拒绝回退；语音节点订阅需显式启用 udp-relay。
udp_whitelist = 1-442, 444-65535
fallback_udp_policy = reject

[dns]

# no-ipv6 只抑制 AAAA 查询；进入隧道的公网 IPv6 另由 filter_local 拒绝。
# 直连/IP 分流使用 IP 形式的 DoH，避免 DoH 主机名的系统 DNS 引导查询。
# 两个 DoH 并发查询；已匹配代理域名的连接仍由节点远端解析。
no-ipv6
no-system
doh-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query

# 仅内网域名例外使用当前网络 DNS，以支持路由器/企业内网解析。
# 当前网络需提供内网 DNS；不要将这些私有名称交给公网 DNS 转发。
server = /lan/system
server = /*.lan/system
server = /local/system
server = /*.local/system
server = /home.arpa/system
server = /*.home.arpa/system

[server_local]

[server_remote]
# 在 App 的资源页面添加私有 client=quanx 链接；公共仓库中保持为空。

