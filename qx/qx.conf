# Quantumult X 网络核心配置
#
# 公共配置只包含 DNS、分流和防泄漏策略。节点订阅必须在 Quantumult X 的
# 资源页面单独添加，建议使用 SublinkPro 的 client=quanx 私有分享链接。
# 不要把 Token、机场地址或其他凭据提交到本文件。

[general]

# 使用 HTTPS 进行节点延迟与网络可达性检测，避免明文探测请求。
server_check_url = https://www.gstatic.com/generate_204
server_check_timeout = 3000
network_check_url = https://www.apple.com/library/test/success.html

# 只绕过局域网 SSDP；公网地址不得排除出隧道。
excluded_routes = 239.255.255.250/32

# 阻断 QUIC，节点不支持 UDP 时拒绝回退，避免 UDP 直连绕过策略。
udp_whitelist = 1-442, 444-65535
fallback_udp_policy = reject

[dns]

# iOS 端关闭 IPv6 与系统 DNS，所有业务域名统一通过带证书校验的 DoH 解析。
no-ipv6
no-system
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

[server_local]

[server_remote]
# 在 App 的资源页面添加私有 client=quanx 链接；公共仓库中保持为空。

