host-suffix, home.arpa, direct
# QX 不建立 Tailscale 隧道；需已有 LAN 网关提供路由与私有 DNS，或切换到 Tailscale App。
host-suffix, tailscale.com, direct
host-suffix, ts.net, direct
host-suffix, voice.google.com, 📞 Voice

# 私网与链路本地地址保持直连，但仍由 QX 隧道执行策略。
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 169.254.0.0/16, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/4, direct

# 保留本机、ULA、链路本地和组播；仅拒绝进入 QX 隧道的其他 IPv6。
# 硬编码 IPv6 能否被隧道接管仍需在设备上验证，不能仅凭 no-ipv6 保证。
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
ip6-cidr, fe80::/10, direct
ip6-cidr, ff00::/8, direct
ip6-cidr, ::/0, reject

# 中国 IP 直连，其余流量进入代理兜底。
geoip, cn, direct
final, 🐟 漏网之鱼

